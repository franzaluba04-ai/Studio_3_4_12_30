<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aluba-portfolio</title>
    <script>
      const portfolioMarker = '/aluba-portfolio/'
      const portfolioBasePath = window.location.pathname.includes(portfolioMarker)
        ? window.location.pathname.split(portfolioMarker)[0] + portfolioMarker
        : portfolioMarker

      document.write(`<base href="${window.location.origin}${portfolioBasePath}">`)
    </script>
    <style>
      .studio-back-button {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 9999;
        display: inline-grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(15, 23, 42, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: #0f172a;
        box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
        backdrop-filter: blur(14px);
        transition:
          transform 160ms ease,
          background 160ms ease,
          border-color 160ms ease;
      }

      .studio-back-button:hover {
        transform: translateX(-2px);
        border-color: rgba(15, 23, 42, 0.32);
        background: rgba(255, 255, 255, 0.96);
      }

      .studio-back-button:focus-visible {
        outline: 3px solid rgba(14, 116, 144, 0.35);
        outline-offset: 3px;
      }

      .studio-back-button svg {
        width: 22px;
        height: 22px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BjG8R0IC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DR_ui9kR.css">
  </head>
  <body>
    <a class="studio-back-button" href="../" aria-label="Back to Studio 4-ITS">
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </a>
    <div id="root"></div>
    <script>
      const studioBackButton = document.querySelector('.studio-back-button')
      const studioMarker = '/aluba-portfolio'
      const markerIndex = window.location.pathname.indexOf(studioMarker)
      const studioHomePath =
        markerIndex >= 0 ? window.location.pathname.slice(0, markerIndex + 1) : './'

      studioBackButton.href = `${window.location.origin}${studioHomePath}`
      studioBackButton.addEventListener('click', (event) => {
        event.preventDefault()
        window.location.href = studioBackButton.href
      })
    </script>
  </body>
</html>
